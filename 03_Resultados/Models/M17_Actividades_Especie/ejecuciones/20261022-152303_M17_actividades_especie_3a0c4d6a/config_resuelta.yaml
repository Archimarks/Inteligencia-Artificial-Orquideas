split:
  strategy: group_kfold
  n_splits: 5
  group_column: ID_ARTICULO
  min_groups_per_class: 3
  min_samples_per_class: 5
evaluation:
  permutation_test: true
  n_permutations: 50
  confounding_control: true
  evaluacion_optimista: true
outputs:
  save_model: true
  save_predictions: true
  save_plots: true
  dpi: 200
  overwrite: false
id: M17_actividades_especie
nombre: Actividades biologicas de una especie a partir de su perfil quimico
tarea: supervisado
prioridad: alta
pregunta_cientifica: ¿El perfil composicional de una especie (superclases quimicas)
  permite anticipar que actividades biologicas se le atribuyen?
descripcion: Unidad = especie x articulo con actividad registrada y perfil (>= 20
  metabolitos). Y = actividades (multietiqueta) con >= 8 unidades positivas. X = CLR
  por superclase. Grupos = articulo.
conjunto:
  nombre: actividad_especie
  parametros:
    nivel: superclase
    min_positivos: 8
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
interpretacion: 'Etiquetas positivas-no etiquetadas: una actividad ausente puede no
  haberse estudiado. Con ~60 unidades la incertidumbre es grande; solo una mejora
  clara sobre la prevalencia y p < 0.05 sugiere senal.'
seleccion_variables:
  metodo: ninguna
semilla: 42
n_jobs: -1
