split:
  strategy: group_kfold
  n_splits: 5
  group_column: ID_ARTICULO
  min_groups_per_class: 2
  min_samples_per_class: 10
evaluation:
  permutation_test: true
  n_permutations: 30
  confounding_control: true
  evaluacion_optimista: true
outputs:
  save_model: true
  save_predictions: true
  save_plots: true
  dpi: 200
  overwrite: false
id: M05_familia
nombre: Familia botanica a partir del perfil quimico
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿El perfil composicional permite reconocer la familia botanica
  (p. ej. Orchidaceae) de una planta de un estudio no visto?
descripcion: Unidad = muestra biologica (sin QC ni blancos) con >= 20 metabolitos
  clasificados. X = CLR de los conteos de metabolitos por clase quimica (60 clases
  presentes en >= 5 articulos + 'otras'). Validacion agrupada por articulo (StratifiedGroupKFold,
  5 particiones); solo clases presentes en >= 2 articulos. Pesos 1/n por articulo.
  Se compara con baselines, con un control que usa solo variables de plataforma (columna,
  modos, n de senales/identificados), con una validacion no agrupada (optimista) y
  con una prueba de permutacion.
conjunto:
  nombre: perfil_muestra
  parametros:
    objetivo: ID_FAMILIA
    nivel: clase
    transformacion: clr
    min_metabolitos: 20
    min_articulos_categoria: 5
    max_categorias: 60
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
interpretacion: Orchidaceae tiene dos articulos (Gastrodia elata y Dendrobium officinale)
  con plataformas distintas.
seleccion_variables:
  metodo: ninguna
semilla: 42
n_jobs: -1
