split:
  strategy: group_kfold
  n_splits: 5
  group_column: ID_ARTICULO
  min_groups_per_class: 3
  min_samples_per_class: 5
evaluation:
  permutation_test: true
  n_permutations: 30
  confounding_control: true
  evaluacion_optimista: true
outputs:
  save_model: true
  save_predictions: true
  save_plots: true
  dpi: 200
  overwrite: false
id: M16_metabolitos
nombre: Presencia de metabolitos frecuentes a partir de taxonomia y tipo de muestra
tarea: supervisado
prioridad: alta
pregunta_cientifica: Dado el taxon (clase, orden, familia), la parte de la planta,
  el tipo de muestra, el cultivo y la extraccion, ¿que metabolitos frecuentes cabe
  esperar en una planta de un estudio no visto?
descripcion: Unidad = grupo de muestras (lote x especie x parte x tipo x cultivo x
  metodo). Y = presencia (0/1) de los 60 metabolitos presentes en mas articulos (>=
  5). X = one-hot de taxonomia y atributos de muestra. Multietiqueta, grupos = articulo.
  Control = solo plataforma (columna, modos, profundidad de identificacion).
conjunto:
  nombre: presencia_metabolitos
  parametros:
    min_articulos: 5
    max_metabolitos: 60
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
interpretacion: 'La presencia depende de la biblioteca del laboratorio tanto como
  de la planta: si el control solo-plataforma iguala al modelo, lo que se predice
  es la cobertura de la biblioteca, no la quimica del taxon. La precision promedio
  debe compararse con la prevalencia de cada metabolito.'
seleccion_variables:
  metodo: ninguna
semilla: 42
n_jobs: -1
