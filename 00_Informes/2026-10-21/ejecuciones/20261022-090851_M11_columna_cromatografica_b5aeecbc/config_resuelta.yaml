split:
  strategy: group_kfold
  n_splits: 5
  group_column: ID_ARTICULO
  min_groups_per_class: 2
  min_samples_per_class: 10
evaluation:
  permutation_test: true
  n_permutations: 30
  confounding_control: true
outputs:
  save_model: true
  save_predictions: true
  save_plots: true
  dpi: 200
  overwrite: false
id: M11_columna_cromatografica
nombre: Columna cromatografica a partir del perfil quimico
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿El perfil de metabolitos identificados delata la columna cromatografica
  usada (efecto de plataforma)?
descripcion: Unidad = muestra biologica (sin QC ni blancos) con >= 20 metabolitos
  clasificados. X = CLR de los conteos de metabolitos por clase quimica (60 clases
  presentes en >= 5 articulos + 'otras'). Validacion agrupada por articulo (StratifiedGroupKFold,
  5 particiones); solo clases presentes en >= 2 articulos. Pesos 1/n por articulo.
  Se compara con baselines, con un control que usa solo variables de plataforma (modos,
  n de senales/identificados), con una validacion no agrupada (optimista) y con una
  prueba de permutacion.
conjunto:
  nombre: perfil_muestra
  parametros:
    objetivo: ID_COLUMNA_CROMATOGRAFICA
    nivel: clase
    transformacion: clr
    min_metabolitos: 20
    min_articulos_categoria: 5
    max_categorias: 60
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
- nombre: lightgbm
interpretacion: 'Este modelo mide el efecto de plataforma: si la columna se predice
  bien, los perfiles reflejan el metodo analitico y no solo la planta.'
seleccion_variables:
  metodo: ninguna
semilla: 42
n_jobs: -1
