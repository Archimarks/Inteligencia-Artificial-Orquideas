# Rutas del proyecto. Las rutas relativas se resuelven contra `raiz_proyecto`.
# `raiz_proyecto: auto` toma la carpeta padre de 02_Script (funciona en Windows y Linux).
# Para fijarla manualmente en Windows: raiz_proyecto: "D:/Inteligencia Artificial Orquideas"
raiz_proyecto: auto

datos:
  base: 01_Datos/Dataset
  dataset: 01_Datos/Dataset/Dataset.csv
  catalogos: 01_Datos/Dataset

# Todos los resultados quedan en 03_Resultados:
#   Global/                 auditoria general de datos, resumen ejecutivo, informe cientifico, comparacion de modelos
#   Models/<Modelo>/        una carpeta por modelo con auditoria_datos, ejecuciones, metricas, graficas,
#                           predicciones, informes y modelo_entrenado
salidas:
  resultados: 03_Resultados
  global: 03_Resultados/Global
  modelos: 03_Resultados/Models
  cache: 03_Resultados/_cache
  documentacion: 05_Documentacion

configuracion:
  modelos: 02_Script/config/modelos
