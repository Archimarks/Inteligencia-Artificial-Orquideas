id: M02_filo
nombre: Filo a partir del perfil quimico
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿El perfil quimico distingue angiospermas de gimnospermas y helechos?
descripcion: Unidad = muestra biologica (sin QC ni blancos) con >= 20 metabolitos clasificados. X = CLR de los conteos
  de metabolitos por clase quimica (60 clases presentes en >= 5 articulos + 'otras'). Validacion agrupada por articulo
  (StratifiedGroupKFold, 5 particiones); solo clases presentes en >= 2 articulos. Pesos 1/n por articulo. Se compara
  con baselines, con un control que usa solo variables de plataforma (columna, modos, n de senales/identificados),
  con una validacion no agrupada (optimista) y con una prueba de permutacion.
conjunto:
  nombre: perfil_muestra
  parametros:
    objetivo: ID_FILO
    nivel: clase
    transformacion: clr
    min_metabolitos: 20
    min_articulos_categoria: 5
    max_categorias: 60
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 10
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 30
interpretacion: Solo Magnoliophyta tiene muestras en >= 2 articulos; se espera 'no viable'. El reino (Plantae) es
  constante y no se modela.
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M02` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: Dataset.csv
      # variables de entrada: ID_CLASE_QUIMICA, ID_METABOLITO
      # objetivo: ID_FILO
      # grupos de validacion: ID_ARTICULO
      # control instrumental: ID_COLUMNA_CROMATOGRAFICA, ID_MODO_IONIZACION, ID_METABOLITO,
      #   ID_NIVEL_IDENTIFICACION
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
      #   ID_TIPO_MUESTRA
    registro_actividades: 05_Pivotes/Registo_Actividades_biologicas.csv
      # filtros y agregacion: ID_MUESTRA
  variables:
    incluir: []
    excluir: []
