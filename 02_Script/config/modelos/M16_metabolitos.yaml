id: M16_metabolitos
nombre: Presencia de metabolitos frecuentes a partir de taxonomia y tipo de muestra
tarea: supervisado
prioridad: alta
pregunta_cientifica: Dado el taxon (clase, orden, familia), la parte de la planta, el tipo de muestra, el cultivo
  y la extraccion, ¿que metabolitos frecuentes cabe esperar en una planta de un estudio no visto?
descripcion: Unidad = grupo de muestras (lote x especie x parte x tipo x cultivo x metodo). Y = presencia (0/1)
  de los 60 metabolitos presentes en mas articulos (>= 5). X = one-hot de taxonomia y atributos de muestra. Multietiqueta,
  grupos = articulo. Control = solo plataforma (columna, modos, profundidad de identificacion).
conjunto:
  nombre: presencia_metabolitos
  parametros:
    min_articulos: 5
    max_metabolitos: 60
split:
  n_splits: 5
  min_groups_per_class: 3
  min_samples_per_class: 5
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 30
interpretacion: 'La presencia depende de la biblioteca del laboratorio tanto como de la planta: si el control solo-plataforma
  iguala al modelo, lo que se predice es la cobertura de la biblioteca, no la quimica del taxon. La precision promedio
  debe compararse con la prevalencia de cada metabolito.'
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M16` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: Dataset.csv
      # variables de entrada: ID_CLASE_TAXONOMICA, ID_ORDEN, ID_FAMILIA, ID_PARTE_ESTUDIADA, ID_TIPO_MUESTRA,
      #   ID_TIPO_CULTIVO, ID_METODO_EXTRACCION
      # objetivo: ID_METABOLITO
      # grupos de validacion: ID_ARTICULO
      # control instrumental: ID_COLUMNA_CROMATOGRAFICA, ID_MODO_IONIZACION, ID_METABOLITO,
      #   ID_NIVEL_IDENTIFICACION
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
      #   ID_TIPO_MUESTRA, ID_BATCH, ID_ESPECIE, ID_PARTE_ESTUDIADA, ID_TIPO_CULTIVO, ID_METODO_EXTRACCION
    registro_actividades: 05_Pivotes/Registo_Actividades_biologicas.csv
      # filtros y agregacion: ID_MUESTRA
  variables:
    incluir: []
    excluir: []
