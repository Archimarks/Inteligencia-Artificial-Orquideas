id: M10_aducto
nombre: Tipo de aducto a partir de la quimica del compuesto y el modo
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La formula, la superclase y el modo de ionizacion permiten anticipar que aducto se informara
  para un metabolito en un estudio no visto?
descripcion: Unidad = (articulo, metabolito, aducto) con aducto informado (15 aductos mas frecuentes entre articulos).
  X = descriptores de formula + modo + superclase. m/z excluida (m/z - masa = masa del aducto). Grupos = articulo.
  Control instrumental = solo el modo.
conjunto:
  nombre: metabolito_aducto
  parametros:
    max_clases: 15
    incluir_superclase: true
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 20
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
    min_samples_leaf: 5
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: El modo determina la polaridad del aducto ([M+H]+ vs [M-H]-); el valor de la quimica se mide como
  la mejora sobre el control que solo usa el modo.
seleccion_variables:
  metodo: ninguna

# --- Datos de entrenamiento (supervisado) ---------------------------------------------------------------------
# tipo_aprendizaje: supervisado -> el modelo aprende a predecir una variable objetivo
# objetivo: columna a predecir | grupos_validacion: columna cuyos valores nunca se reparten entre
#   entrenamiento y prueba en la validacion cruzada
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: origen de las variables X (quitar una columna elimina sus variables)
#   objetivo / grupos_validacion: de que archivo salen (deben coincidir con lo de arriba)
#   control_instrumental: variables de plataforma del modelo de control (quitar = no usarlas)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# variables.incluir / excluir: seleccion fina de las variables X ya construidas (comodines * ?)
# Ver sin entrenar: python main.py datos M10 [--variables] | Regenerar: python main.py datos M10 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: supervisado
  objetivo: ID_ADUCTO
  grupos_validacion: ID_ARTICULO
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      entrada: [FORMULA_MOLECULAR, ID_MODO_IONIZACION, ID_SUPERCLASE_QUIMICA]
      objetivo: [ID_ADUCTO]
      grupos_validacion: [ID_ARTICULO]
      control_instrumental: [ID_MODO_IONIZACION]
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      filtros_agregacion: [ID_MUESTRA]
  variables:
    incluir: []
    excluir: []
