id: M10_aducto
nombre: Tipo de aducto a partir de la quimica del compuesto y el modo
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La formula, la superclase y el modo de ionizacion permiten anticipar que aducto se informara
  para un metabolito en un estudio no visto?
descripcion: Unidad = (articulo, metabolito, aducto) con aducto informado (15 aductos mas frecuentes entre articulos).
  X = descriptores de formula + modo + superclase. m/z excluida (m/z - masa = masa del aducto). Grupos = articulo.
  Control instrumental = solo el modo.
conjunto:
  nombre: metabolito_aducto
  parametros:
    max_clases: 15
    incluir_superclase: true
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 20
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
    min_samples_leaf: 5
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: El modo determina la polaridad del aducto ([M+H]+ vs [M-H]-); el valor de la quimica se mide como
  la mejora sobre el control que solo usa el modo.
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M10` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: Dataset.csv
      # variables de entrada: FORMULA_MOLECULAR, ID_MODO_IONIZACION, ID_SUPERCLASE_QUIMICA
      # objetivo: ID_ADUCTO
      # grupos de validacion: ID_ARTICULO
      # control instrumental: ID_MODO_IONIZACION
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION
    registro_actividades: 05_Pivotes/Registo_Actividades_biologicas.csv
      # filtros y agregacion: ID_MUESTRA
  variables:
    incluir: []
    excluir: []
