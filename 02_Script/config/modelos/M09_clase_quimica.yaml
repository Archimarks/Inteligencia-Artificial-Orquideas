id: M09_clase_quimica
nombre: Clase quimica a partir de la formula molecular
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La formula molecular permite asignar la clase quimica (nivel fino de la ontologia) de un metabolito?
descripcion: Igual que M08 pero con las 40 clases quimicas mas frecuentes (>= 50 metabolitos y >= 5 formulas). Grupos
  = formula.
conjunto:
  nombre: metabolito_quimica
split:
  n_splits: 5
  min_groups_per_class: 5
  min_samples_per_class: 50
max_clases: 40
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: Problema mas dificil que M08 por el numero de clases y los isomeros; comparar con top3_accuracy.
seleccion_variables:
  metodo: ninguna

# --- Datos de entrenamiento (supervisado) ---------------------------------------------------------------------
# tipo_aprendizaje: supervisado -> el modelo aprende a predecir una variable objetivo
# objetivo: columna a predecir | grupos_validacion: columna cuyos valores nunca se reparten entre
#   entrenamiento y prueba en la validacion cruzada
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: origen de las variables X (quitar una columna elimina sus variables)
#   objetivo / grupos_validacion: de que archivo salen (deben coincidir con lo de arriba)
#   control_instrumental: variables de plataforma del modelo de control (quitar = no usarlas)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# variables.incluir / excluir: seleccion fina de las variables X ya construidas (comodines * ?)
# Ver sin entrenar: python main.py datos M09 [--variables] | Regenerar: python main.py datos M09 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: supervisado
  objetivo: ID_CLASE_QUIMICA
  grupos_validacion: FORMULA_MOLECULAR
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      filtros_agregacion: [ID_MUESTRA]
    metabolitos:
      ruta: 07_Metabolitos/01_Metabolitos.csv
      entrada: [FORMULA_MOLECULAR]
      grupos_validacion: [FORMULA_MOLECULAR]
      filtros_agregacion: [ID_METABOLITO, ID_CLASE_QUIMICA]
    clases_quim:
      ruta: 06_Quimica_Analitica/03_Clases_quimicas.csv
      objetivo: [ID_CLASE_QUIMICA]
      filtros_agregacion: [ID_CLASE_QUIMICA]
  variables:
    incluir: []
    excluir: []
