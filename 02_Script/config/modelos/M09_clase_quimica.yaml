id: M09_clase_quimica
nombre: Clase quimica a partir de la formula molecular
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La formula molecular permite asignar la clase quimica (nivel fino de la ontologia) de un metabolito?
descripcion: Igual que M08 pero con las 40 clases quimicas mas frecuentes (>= 50 metabolitos y >= 5 formulas). Grupos
  = formula.
conjunto:
  nombre: metabolito_quimica
  parametros:
    objetivo: ID_CLASE_QUIMICA
split:
  n_splits: 5
  min_groups_per_class: 5
  min_samples_per_class: 50
max_clases: 40
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: Problema mas dificil que M08 por el numero de clases y los isomeros; comparar con top3_accuracy.
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M09` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: 10_Dataset_final/Dataset.csv
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION
    registro_actividades: 09_Hechos/04_Registro_actividades.csv
      # filtros y agregacion: ID_MUESTRA
    metabolitos: 07_Metabolitos/01_Metabolitos.csv
      # variables de entrada: FORMULA_MOLECULAR
      # grupos de validacion: FORMULA_MOLECULAR
      # filtros y agregacion: ID_METABOLITO, ID_CLASE_QUIMICA
    clases_quim: 06_Quimica_Analitica/03_Clases_quimicas.csv
      # objetivo: ID_CLASE_QUIMICA
      # filtros y agregacion: ID_CLASE_QUIMICA
  variables:
    incluir: []
    excluir: []
