id: M04_orden
nombre: Orden taxonomico a partir del perfil quimico
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿El perfil composicional permite reconocer el orden taxonomico de una planta de un estudio
  no visto?
descripcion: Unidad = muestra biologica (sin QC ni blancos) con >= 20 metabolitos clasificados. X = CLR de los conteos
  de metabolitos por clase quimica (60 clases presentes en >= 5 articulos + 'otras'). Validacion agrupada por articulo
  (StratifiedGroupKFold, 5 particiones); solo clases presentes en >= 2 articulos. Pesos 1/n por articulo. Se compara
  con baselines, con un control que usa solo variables de plataforma (columna, modos, n de senales/identificados),
  con una validacion no agrupada (optimista) y con una prueba de permutacion.
conjunto:
  nombre: perfil_muestra
  parametros:
    objetivo: ID_ORDEN
    nivel: clase
    transformacion: clr
    min_metabolitos: 20
    min_articulos_categoria: 5
    max_categorias: 60
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 10
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 30
interpretacion: Cada orden se representa por pocos articulos; los ordenes con un unico articulo se descartan.
seleccion_variables:
  metodo: ninguna
