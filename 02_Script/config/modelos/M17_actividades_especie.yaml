id: M17_actividades_especie
nombre: Actividades biologicas de una especie a partir de su perfil quimico
tarea: supervisado
prioridad: alta
pregunta_cientifica: ¿El perfil composicional de una especie (superclases quimicas) permite anticipar que actividades
  biologicas se le atribuyen?
descripcion: Unidad = especie x articulo con actividad registrada y perfil (>= 20 metabolitos). Y = actividades
  (multietiqueta) con >= 8 unidades positivas. X = CLR por superclase. Grupos = articulo.
conjunto:
  nombre: actividad_especie
  parametros:
    nivel: superclase
    min_positivos: 8
split:
  n_splits: 5
  min_groups_per_class: 3
  min_samples_per_class: 5
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 50
interpretacion: 'Etiquetas positivas-no etiquetadas: una actividad ausente puede no haberse estudiado. Con ~60 unidades
  la incertidumbre es grande; solo una mejora clara sobre la prevalencia y p < 0.05 sugiere senal.'
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M17` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: Dataset.csv
      # variables de entrada: ID_SUPERCLASE_QUIMICA, ID_METABOLITO
      # grupos de validacion: ID_ARTICULO
      # control instrumental: ID_COLUMNA_CROMATOGRAFICA, ID_MODO_IONIZACION, ID_METABOLITO,
      #   ID_NIVEL_IDENTIFICACION
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
      #   ID_TIPO_MUESTRA, ID_ESPECIE
    registro_actividades: 05_Pivotes/Registo_Actividades_biologicas.csv
      # objetivo: ID_ACTIVIDAD_BIOLOGICA
      # filtros y agregacion: ID_MUESTRA, ID_ARTICULO, ID_ESPECIE
  variables:
    incluir: []
    excluir: []
