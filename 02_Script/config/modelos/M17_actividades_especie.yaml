id: M17_actividades_especie
nombre: Actividades biologicas de una especie a partir de su perfil quimico
tarea: supervisado
prioridad: alta
pregunta_cientifica: ¿El perfil composicional de una especie (superclases quimicas) permite anticipar que actividades
  biologicas se le atribuyen?
descripcion: Unidad = especie x articulo con actividad registrada y perfil (>= 20 metabolitos). Y = actividades
  (multietiqueta) con >= 8 unidades positivas. X = CLR por superclase. Grupos = articulo.
conjunto:
  nombre: actividad_especie
  parametros:
    nivel: superclase
    min_positivos: 8
split:
  n_splits: 5
  min_groups_per_class: 3
  min_samples_per_class: 5
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 50
interpretacion: 'Etiquetas positivas-no etiquetadas: una actividad ausente puede no haberse estudiado. Con ~60 unidades
  la incertidumbre es grande; solo una mejora clara sobre la prevalencia y p < 0.05 sugiere senal.'
seleccion_variables:
  metodo: ninguna

# --- Datos de entrenamiento (supervisado) ---------------------------------------------------------------------
# tipo_aprendizaje: supervisado -> el modelo aprende a predecir una variable objetivo
# objetivo: columna a predecir | grupos_validacion: columna cuyos valores nunca se reparten entre
#   entrenamiento y prueba en la validacion cruzada
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: origen de las variables X (quitar una columna elimina sus variables)
#   objetivo / grupos_validacion: de que archivo salen (deben coincidir con lo de arriba)
#   control_instrumental: variables de plataforma del modelo de control (quitar = no usarlas)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# variables.incluir / excluir: seleccion fina de las variables X ya construidas (comodines * ?)
# Ver sin entrenar: python main.py datos M17 [--variables] | Regenerar: python main.py datos M17 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: supervisado
  objetivo: ID_ACTIVIDAD_BIOLOGICA
  grupos_validacion: ID_ARTICULO
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      entrada: [ID_SUPERCLASE_QUIMICA, ID_METABOLITO]
      grupos_validacion: [ID_ARTICULO]
      control_instrumental: [ID_COLUMNA_CROMATOGRAFICA, ID_MODO_IONIZACION, ID_TECNICA_SEPARACION,
        ID_INSTRUMENTO, ID_ANALIZADOR, ID_METABOLITO, ID_NIVEL_IDENTIFICACION]
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
        ID_TIPO_MUESTRA, ID_ESPECIE]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      objetivo: [ID_ACTIVIDAD_BIOLOGICA]
      filtros_agregacion: [ID_MUESTRA, ID_ARTICULO, ID_ESPECIE]
  variables:
    incluir: []
    excluir: []
