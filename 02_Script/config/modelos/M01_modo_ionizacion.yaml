id: M01_modo_ionizacion
nombre: Modo de ionizacion (ESI+ / ESI-) a partir de la quimica del compuesto
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La composicion elemental y la superclase de un metabolito permiten anticipar si se detecta
  en ESI positivo o negativo, en articulos no vistos?
descripcion: Unidad = (articulo, metabolito) detectado en un solo modo, solo en articulos que adquirieron ambos
  modos. X = descriptores de la formula (C, H, N, O, P, S, DBE, H/C, O/C, indice de aromaticidad...) + superclase.
  Sin m/z, aducto ni RT (fuga). Grupos = articulo.
conjunto:
  nombre: metabolito_modo
  parametros:
    incluir_superclase: true
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 10
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
    min_samples_leaf: 5
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: 'Los acidos (carboxilos, fenoles, fosfatos) tienden a ionizar en negativo y las bases nitrogenadas
  en positivo. Un rendimiento moderado es esperable: muchos compuestos ionizan en ambos modos y la eleccion depende
  del metodo.'
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M01` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    dataset: Dataset.csv
      # variables de entrada: FORMULA_MOLECULAR, ID_SUPERCLASE_QUIMICA
      # objetivo: ID_MODO_IONIZACION
      # grupos de validacion: ID_ARTICULO
      # filtros y agregacion: ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION
    registro_actividades: 05_Pivotes/Registo_Actividades_biologicas.csv
      # filtros y agregacion: ID_MUESTRA
  variables:
    incluir: []
    excluir: []
