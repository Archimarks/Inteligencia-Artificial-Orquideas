id: M01_modo_ionizacion
nombre: Modo de ionizacion (ESI+ / ESI-) a partir de la quimica del compuesto
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La composicion elemental y la superclase de un metabolito permiten anticipar si se detecta
  en ESI positivo o negativo, en articulos no vistos?
descripcion: Unidad = (articulo, metabolito) detectado en un solo modo, solo en articulos que adquirieron ambos
  modos. X = descriptores de la formula (C, H, N, O, P, S, DBE, H/C, O/C, indice de aromaticidad...) + superclase.
  Sin m/z, aducto ni RT (fuga). Grupos = articulo.
conjunto:
  nombre: metabolito_modo
  parametros:
    incluir_superclase: true
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 10
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
    min_samples_leaf: 5
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 20
interpretacion: 'Los acidos (carboxilos, fenoles, fosfatos) tienden a ionizar en negativo y las bases nitrogenadas
  en positivo. Un rendimiento moderado es esperable: muchos compuestos ionizan en ambos modos y la eleccion depende
  del metodo.'
seleccion_variables:
  metodo: ninguna

# --- Datos de entrenamiento (supervisado) ---------------------------------------------------------------------
# tipo_aprendizaje: supervisado -> el modelo aprende a predecir una variable objetivo
# objetivo: columna a predecir | grupos_validacion: columna cuyos valores nunca se reparten entre
#   entrenamiento y prueba en la validacion cruzada
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: origen de las variables X (quitar una columna elimina sus variables)
#   objetivo / grupos_validacion: de que archivo salen (deben coincidir con lo de arriba)
#   control_instrumental: variables de plataforma del modelo de control (quitar = no usarlas)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# variables.incluir / excluir: seleccion fina de las variables X ya construidas (comodines * ?)
# Ver sin entrenar: python main.py datos M01 [--variables] | Regenerar: python main.py datos M01 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: supervisado
  objetivo: ID_MODO_IONIZACION
  grupos_validacion: ID_ARTICULO
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      entrada: [FORMULA_MOLECULAR, ID_SUPERCLASE_QUIMICA]
      objetivo: [ID_MODO_IONIZACION]
      grupos_validacion: [ID_ARTICULO]
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      filtros_agregacion: [ID_MUESTRA]
  variables:
    incluir: []
    excluir: []
