# ==============================================================================================================
# M18_patrones_quimicos - Patrones quimicos: enriquecimiento, coocurrencia, reglas, agrupamiento y particion de varianza
# Entrenamientos: no supervisado (patrones)
# Ejecutar: python main.py ejecutar M18 | Ver datos y variables sin entrenar: python main.py datos M18 --variables
# ==============================================================================================================
id: M18_patrones_quimicos
nombre: 'Patrones quimicos: enriquecimiento, coocurrencia, reglas, agrupamiento y particion de varianza'
tarea: patrones                     # entrenamiento principal: supervisado | patrones (no supervisado)
prioridad: central                  # normal | alta | central (orden en la interfaz)
pregunta_cientifica: >-
  ¿Que patrones quimicos (categorias enriquecidas por taxon u organo, categorias que coaparecen, reglas taxon ->
  quimica, grupos de especies con perfil similar, perfiles atipicos y asociaciones quimica-actividad) se
  sostienen cuando se controla que cada articulo aporta su propia plataforma y biblioteca de anotacion?
descripcion: >-
  Unidad = especie x articulo x parte de la planta (suma de muestras biologicas). Perfil = numero de metabolitos
  identificados por superclase (o clase) quimica, transformado con CLR. Contrastes Mann-Whitney con correccion
  BH, coocurrencias con Fisher exacto + BH, FP-growth, K-means con estabilidad bootstrap, PERMANOVA (R2 marginal
  con permutaciones; version intra-articulo centrando por estudio), Isolation Forest, enriquecimiento
  superclase-actividad y firma descriptiva de Orchidaceae.
interpretacion: >-
  Un patron es candidato a hallazgo solo si (1) aparece en varios articulos independientes, (2) sobrevive a la
  correccion por comparaciones multiples y (3) no se explica mejor por columna/plataforma (comparar R2 de
  articulo y columna con el de orden/familia). Las coocurrencias pueden deberse a bibliotecas compartidas (p.
  ej. MRM de Metware). La firma de orquideas es descriptiva: solo hay dos estudios de Orchidaceae.

# --- Analisis no supervisado de patrones (sin variable objetivo) ----------------------------------------------
conjunto: {}
patrones:
  alfa: 0.05                        # nivel de significancia tras la correccion BH
  min_metabolitos: 20               # excluye unidades con menos metabolitos identificados
  min_articulos_categoria: 3        # superclases presentes en >= N articulos
  min_articulos_clase: 5            # clases presentes en >= N articulos
  max_clases: 60                    # maximo de clases quimicas
  max_aristas: 120                  # aristas en la red de coocurrencia
  n_permutaciones: 499              # permutaciones de PERMANOVA
  factores_enriquecimiento: [ID_CLASE_TAXONOMICA, ID_ORDEN, ID_FAMILIA, ID_PARTE_ESTUDIADA, ID_TIPO_MUESTRA]  # factores con los que se contrastan los perfiles
  n_nulos: 300                      # aleatorizaciones curveball para la coocurrencia
  reglas:  # reglas de asociacion (FP-growth)
    min_soporte: 0.2
    min_confianza: 0.9
    min_confianza_taxon: 0.8
    min_lift: 1.5
    max_longitud: 3
    max_soporte_item: 0.8
    max_reglas_guardadas: 2000
    items_taxonomicos: [ID_ORDEN, ID_FAMILIA]  # taxones usados como items
  agrupamiento:  # K-means sobre el perfil (k elegido por silueta)
    k_max: 8
    n_bootstrap: 30                 # remuestreos para la estabilidad

# --- Datos de entrenamiento (no supervisado) ------------------------------------------------------------------
# tipo_aprendizaje: no_supervisado -> no hay variable objetivo: se buscan patrones, grupos y contrastes
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: columnas que forman los perfiles quimicos analizados (informativo; los perfiles se ajustan
#     en el bloque patrones)
#   factores_contraste: factores con los que se contrastan los perfiles (taxon, organo, articulo...)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# Ver sin entrenar: python main.py datos M18 [--variables] | Regenerar: python main.py datos M18 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: no_supervisado
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      entrada: [ID_SUPERCLASE_QUIMICA, ID_CLASE_QUIMICA, ID_METABOLITO]
      factores_contraste: [ID_CLASE_TAXONOMICA, ID_ORDEN, ID_FAMILIA, ID_PARTE_ESTUDIADA, ID_TIPO_MUESTRA,
        ID_ARTICULO, ID_COLUMNA_CROMATOGRAFICA, ID_METODO_EXTRACCION, ID_TIPO_CULTIVO, ID_ESPECIE]
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
        ID_TIPO_MUESTRA, ID_PARTE_ESTUDIADA]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      entrada: [ID_METABOLITO]
      factores_contraste: [ID_ACTIVIDAD_BIOLOGICA]
      filtros_agregacion: [ID_MUESTRA]
    metabolitos:
      ruta: 07_Metabolitos/01_Metabolitos.csv
      entrada: [ID_METABOLITO, ID_CLASE_QUIMICA]
    clases_quim:
      ruta: 06_Quimica_Analitica/03_Clases_quimicas.csv
      entrada: [ID_CLASE_QUIMICA, ID_SUPERCLASE_QUIMICA]
    familias:
      ruta: 02_Taxonomia/05_Familias.csv
      filtros_agregacion: [ID_FAMILIA, FAMILIA]
