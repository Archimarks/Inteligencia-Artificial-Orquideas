id: M17b_actividades_metabolito
nombre: Actividades biologicas de un metabolito a partir de su formula y superclase
tarea: supervisado
prioridad: alta
pregunta_cientifica: ¿La composicion elemental y la superclase de un metabolito con actividad citada permiten anticipar
  que tipo de actividad se le atribuye?
descripcion: Unidad = metabolito con actividad registrada en la literatura citada por los articulos. Y = actividades
  con >= 10 metabolitos. X = descriptores de formula + superclase. Grupos = formula.
conjunto:
  nombre: actividad_metabolito
  parametros:
    min_positivos: 10
split:
  n_splits: 5
  min_groups_per_class: 3
  min_samples_per_class: 5
modelos:
- nombre: baseline_prior
- nombre: logistica
  hiperparametros:
    C: 0.3
- nombre: random_forest
  hiperparametros:
    n_estimators: 300
    class_weight: null
- nombre: knn
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 50
  confounding_control: false
interpretacion: 'Muy pocos metabolitos (~90) y sesgo de publicacion: compuestos famosos acumulan muchas actividades
  citadas.'
seleccion_variables:
  metodo: ninguna

# Archivos y columnas usados para entrenar. Cada ejecucion los informa en consola, en ejecucion.log, en
# datos_entrenamiento.md y en el informe (`python main.py datos M17b` los muestra sin entrenar; con --variables lista tambien las variables finales).
#   archivos: archivo -> ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta). Debajo de cada
#             archivo se indican las columnas que se leen de el y para que se usan.
#   variables: seleccion de las variables de entrada (X). Vacio = todas. Admite comodines (* ?) y nombres
#              de columna de origen: excluir [FORMULA_MOLECULAR] quita todos los descriptores de formula.
datos_entrenamiento:
  archivos:
    registro_actividades: 09_Hechos/04_Registro_actividades.csv
      # objetivo: ID_ACTIVIDAD_BIOLOGICA
      # filtros y agregacion: ID_METABOLITO
    metabolitos: 07_Metabolitos/01_Metabolitos.csv
      # variables de entrada: FORMULA_MOLECULAR, ID_CLASE_QUIMICA
      # grupos de validacion: FORMULA_MOLECULAR
      # filtros y agregacion: ID_METABOLITO
    clases_quim: 06_Quimica_Analitica/03_Clases_quimicas.csv
      # variables de entrada: ID_CLASE_QUIMICA, ID_SUPERCLASE_QUIMICA
  variables:
    incluir: []
    excluir: []
