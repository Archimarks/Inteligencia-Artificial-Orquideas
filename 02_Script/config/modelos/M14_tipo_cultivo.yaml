id: M14_tipo_cultivo
nombre: Tipo de cultivo a partir del perfil quimico
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿El perfil quimico distingue el tipo de cultivo (silvestre, campo, invernadero, in vitro...)
  en articulos no vistos?
descripcion: Unidad = muestra biologica (sin QC ni blancos) con >= 20 metabolitos clasificados. X = CLR de los conteos
  de metabolitos por clase quimica (60 clases presentes en >= 5 articulos + 'otras'). Validacion agrupada por articulo
  (StratifiedGroupKFold, 5 particiones); solo clases presentes en >= 2 articulos. Pesos 1/n por articulo. Se compara
  con baselines, con un control que usa solo variables de plataforma (columna, modos, tecnica de separacion,
  instrumento, analizador, n de senales/identificados), con una validacion no agrupada (optimista) y con una
  prueba de permutacion.
conjunto:
  nombre: perfil_muestra
  parametros:
    nivel: clase
    transformacion: clr
    min_metabolitos: 20
    min_articulos_categoria: 5
    max_categorias: 60
split:
  n_splits: 5
  min_groups_per_class: 2
  min_samples_per_class: 10
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
- nombre: lightgbm
- nombre: xgboost
- nombre: catboost
evaluation:
  n_permutations: 30
interpretacion: El tipo de cultivo suele ser constante dentro de un estudio; la senal puede deberse al estudio.
seleccion_variables:
  metodo: ninguna

# --- Datos de entrenamiento (supervisado) ---------------------------------------------------------------------
# tipo_aprendizaje: supervisado -> el modelo aprende a predecir una variable objetivo
# objetivo: columna a predecir | grupos_validacion: columna cuyos valores nunca se reparten entre
#   entrenamiento y prueba en la validacion cruzada
# archivos.<archivo>: ruta (relativa a datos.catalogos de config/rutas.yaml, o absoluta) y columnas por rol:
#   entrada: origen de las variables X (quitar una columna elimina sus variables)
#   objetivo / grupos_validacion: de que archivo salen (deben coincidir con lo de arriba)
#   control_instrumental: variables de plataforma del modelo de control (quitar = no usarlas)
#   filtros_agregacion: columnas para filtrar muestras y agregar (informativo)
# variables.incluir / excluir: seleccion fina de las variables X ya construidas (comodines * ?)
# Ver sin entrenar: python main.py datos M14 [--variables] | Regenerar: python main.py datos M14 --escribir-yaml
datos_entrenamiento:
  tipo_aprendizaje: supervisado
  objetivo: ID_TIPO_CULTIVO
  grupos_validacion: ID_ARTICULO
  archivos:
    dataset:
      ruta: 10_Dataset_final/Dataset.csv
      entrada: [ID_CLASE_QUIMICA, ID_METABOLITO]
      objetivo: [ID_TIPO_CULTIVO]
      grupos_validacion: [ID_ARTICULO]
      control_instrumental: [ID_COLUMNA_CROMATOGRAFICA, ID_MODO_IONIZACION, ID_TECNICA_SEPARACION,
        ID_INSTRUMENTO, ID_ANALIZADOR, ID_METABOLITO, ID_NIVEL_IDENTIFICACION]
      filtros_agregacion: [ID_MUESTRA, ID_ACTIVIDAD_BIOLOGICA, ID_METABOLITO, ID_NIVEL_IDENTIFICACION,
        ID_TIPO_MUESTRA]
    registro_actividades:
      ruta: 09_Hechos/04_Registro_actividades.csv
      filtros_agregacion: [ID_MUESTRA]
  variables:
    incluir: []
    excluir: []
