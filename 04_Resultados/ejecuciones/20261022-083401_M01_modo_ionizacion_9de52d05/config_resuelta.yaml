split:
  strategy: group_kfold
  n_splits: 5
  group_column: ID_ARTICULO
  min_groups_per_class: 2
  min_samples_per_class: 10
evaluation:
  permutation_test: true
  n_permutations: 10
  confounding_control: true
outputs:
  save_model: true
  save_predictions: true
  save_plots: true
  dpi: 200
  overwrite: false
id: M01_modo_ionizacion
nombre: Modo de ionizacion (ESI+ / ESI-) a partir de la quimica del compuesto
tarea: supervisado
prioridad: normal
pregunta_cientifica: ¿La composicion elemental y la superclase de un metabolito permiten
  anticipar si se detecta en ESI positivo o negativo, en articulos no vistos?
descripcion: Unidad = (articulo, metabolito) detectado en un solo modo, solo en articulos
  que adquirieron ambos modos. X = descriptores de la formula (C, H, N, O, P, S, DBE,
  H/C, O/C, indice de aromaticidad...) + superclase. Sin m/z, aducto ni RT (fuga).
  Grupos = articulo.
conjunto:
  nombre: metabolito_modo
  parametros:
    incluir_superclase: true
modelos:
- nombre: baseline_mayoritaria
- nombre: baseline_estratificada
- nombre: logistica
- nombre: random_forest
  hiperparametros:
    n_estimators: 200
    min_samples_leaf: 5
- nombre: lightgbm
interpretacion: 'Los acidos (carboxilos, fenoles, fosfatos) tienden a ionizar en negativo
  y las bases nitrogenadas en positivo. Un rendimiento moderado es esperable: muchos
  compuestos ionizan en ambos modos y la eleccion depende del metodo.'
seleccion_variables:
  metodo: ninguna
semilla: 42
n_jobs: -1
